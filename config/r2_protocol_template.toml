# R2 finite-record data-to-disk preregistration template.
# A numeric placeholder is invalid until the adjacent provided flag is true.
# Never populate a bound from the target fit residuals.

[protocol]
protocol_id = "UNSET"
version = "0.4.0"
title = "FO-ECG R2 v4 exact-index data-to-disk protocol"
frozen = false
frozen_at_utc = ""
frozen_before_target_ecg_access = false
git_commit = ""
config_sha256 = ""
owner = ""
requested_output_semantics = "deterministic" # deterministic | probabilistic
allowed_result_statuses = ["PASS_DETERMINISTIC", "PASS_PROBABILISTIC", "NOT_CERTIFIABLE", "EXCLUDE_PROTOCOL"]
bound_engine_required = true
baseline_t1_certificate_sha256 = ""
baseline_t1_input_sha256 = ""

[data_boundary]
raw_data_root_env = "ECG_DATA_DIR"
processed_data_root_env = "ECG_PROCESSED_DIR"
output_root_env = "ECG_OUTPUT_DIR"
copy_raw_ecg_into_repository = false
calibration_split_id = ""
identification_split_id = ""
validation_split_id = ""
patient_level_split_required = true
split_contract = "calibration_subject_disjoint_then_within_subject_time"
calibration_subject_disjoint_from_evaluation = true
identification_validation_same_subject = true
calibration_disjoint_from_identification = true
calibration_disjoint_from_validation = true
identification_disjoint_from_validation = true
subject_specific_identification_precedes_validation = true
record_interval_hashes_required = true
minimum_temporal_guard_s = 0.0
temporal_guard_provided = false
split_manifest_sha256 = ""
record_interval_manifest_sha256 = ""

[units]
signal_unit = "UNSET" # e.g. mV or adc_count
physical_time_unit = "s"
phase_unit = "rad"
frequency_unit = "rad/s"
dimensionless_time_symbol = "xi"
tau_star_s = 0.0
tau_star_provided = false
lambda_dimensionless = true
q_z_epsilon_same_signal_unit = true

[model]
alpha_interval = [0.0, 0.0]
alpha_interval_provided = false
lambda_interval = [0.0, 0.0]
lambda_interval_provided = false
principal_fractional_branch = true
common_alpha_across_rates = true
common_positive_lambda_or_preregistered_drift = true
common_q_or_preregistered_restitution = true
q_magnitude_bounds_source = ""
q_bounds_independent_of_target_fit = false
q_bounds_unit = "same_as_signal"
q_abs_lower_by_harmonic = []
q_abs_upper_by_harmonic = []
t1_rate_ids = []
damping_anchor_rate_id = ""

[estimator]
kind = "delayed_causal_weighted_least_squares"
output_only_after_right_r_peak = true
uses_samples_after_right_anchor = false
phase_model = "constant_rate_between_window_anchors"
signal_representation = "UNSET" # real_two_sided_fourier | delayed_causal_analytic
retained_harmonics = []
retained_harmonics_provided = false
include_dc_if_real_signal = false
include_negative_harmonics_if_real_signal = false
weights_sum_to_one = false
weight_rule = "UNSET"
gram_positive_definite_required = true
gram_min_eigenvalue_threshold = 0.0
gram_condition_number_max = 0.0
gram_thresholds_provided = false
coefficient_level_filter_correction = true
require_nonzero_nominal_transfer = true

[window_design]
left_anchor = "R_peak"
right_anchor = "R_peak"
same_subject_required = true
same_lead_required = true
same_physical_gain_required = true
complete_rr_intervals = 0
complete_rr_intervals_provided = false
burn_in_s_min = 0.0
burn_in_provided = false
dwell_s_min = 0.0
dwell_provided = false
fixed_seconds_window_allowed = false
per_window_amplitude_normalization = false
per_window_free_phase_alignment = false
window_selection_uses_target_fit_quality = false
maximum_observed_rr_phase_deviation_rad = 0.0
phase_deviation_threshold_provided = false

[preprocessing]
identity_front_end = true
all_steps_causal = true
uses_filtfilt_or_centered_smoothing = false
same_chain_and_state_policy_across_windows = true
pipeline_manifest = ""
pipeline_manifest_sha256 = ""
filter_state_policy = "continuous_from_record_start" # continuous_from_record_start | restored_certified_state | zero_state_with_tail_bound
nominal_transfer_source = ""
nominal_transfer_calibrated = false
relative_ecg_rpeak_timing_calibrated = false

[evidence_policy]
target_fit_residuals_may_set_bounds = false
post_hoc_bound_tuning_allowed = false
post_hoc_window_exclusion_allowed = false
deterministic_source_kinds = ["sensor_spec", "independent_bounded_calibration", "proved_engineering_envelope", "observable_window_geometry"]
probabilistic_source_kinds = ["gaussian_model", "bootstrap", "empirical_quantile", "confidence_interval", "prediction_interval"]
probabilistic_terms_require_failure_probability = true
bound_numeric_scope = "uniform_all_windows_satisfying_frozen_design"
joint_probability_method = "deterministic_zero" # deterministic_zero | union_bound | directly_calibrated_joint_bound

